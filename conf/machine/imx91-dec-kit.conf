#@TYPE: Machine
#@NAME: Diamond Technologies NXP i.MX 91
#@SOC: i.MX91
#@DESCRIPTION: Machine configuration for Diamond Technologies NXP i.MX 91 Kit
#@MAINTAINER: Diamond Technologies

MACHINEOVERRIDES =. "mx91:"

require include/imx91-dec-kit.inc

DISTRO_NAME = "Diamond Technologies i.MX Release Distro"

KERNEL_DEVICETREE = " \
    freescale/imx91-dec-kit.dtb \
"

KERNEL_DTB = "imx91-dec-kit.dtb"

UBOOT_DTB_NAME = "imx91-dec-kit.dtb"
UBOOT_CONFIG_BASENAME = "imx91_dec"

DDR_FIRMWARE_NAME = " \
    lpddr4_dmem_1d_v202201.bin \
    lpddr4_dmem_2d_v202201.bin \
    lpddr4_imem_1d_v202201.bin \
    lpddr4_imem_2d_v202201.bin \
"

IMXBOOT_TARGETS = "flash_singleboot"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-image kernel-devicetree"

MACHINE_FEATURES:append = " dpdk rdp nxpwifi-all-sdio 00363 00365 "
MACHINE_FIRMWARE:append = " linux-firmware-rtl-nic "

WKS_FILE = "imx-dec-boot-bootpart.wks.in"

# This SOM uses a different EEPROM format than other Diamond Technologies boards
IMAGE_INSTALL:remove = "dec-eeprom-decoder dec-eeprom-services"
